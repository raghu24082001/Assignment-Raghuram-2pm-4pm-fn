<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: red;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            animation-name: circle;
            animation-duration: 3s ;
            position: absolute;
            /* animation-fill-mode: forwards; */
            animation-iteration-count: infinite;
            
            
        }
        @keyframes circle {
            0%{
                top:0px;
                left: 0px;
            }
            50%{
                background-color: blue;
                width: 100px;
                height: 100px;
                top: 100px;
                left: 100px;
            }
            100%{
                width: 200px;
                height: 200px;
                top: 500px;
                left: 500px;
}
            
        }

    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flexbox Row</title>
<style>
.flex-row { display:flex; gap:16px; }
.flex-card { flex:1;
 padding:16px; 
 background:#fafafa; 
 border:1px solid black;
 text-align: center; }
</style>
</head>
<body>
<div class="flex-row">
<div class="flex-card">Card 1</div>
<div class="flex-card">Card 2</div>
<div class="flex-card">Card 3</div>
</div>
</body>
</html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Product Cards - Float Clearfix</title>
<style>
.cf::after { content:""; 
display:table; 
clear:both; }

.product-card { 
  float:left;
  width:30%;
  margin:1%; background:#fff; 
  border:1px solid black; 
  padding:12px; }
</style>
</head>
<body>
<section class="cf">
<div class="product-card">Product 1</div>
<div class="product-card">Product 2</div>
<div class="product-card">Product 3</div>
</section>
</body>
</html>

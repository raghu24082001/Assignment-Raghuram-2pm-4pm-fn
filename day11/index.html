<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
  float: left;
  width: 100px;
  height: 100px;
  background: red;
}

.box2 {
  float: right;
  width: 100px;
  height: 100px;
  background: blue;
}

.clearfix {
  clear: both;
  width: 100px;
  height: 100px;
  background-color: black;
}
    </style>
</head>
<body>
    <div class="box1"></div>
<div class="box2"></div>
<div class="clearfix"></div>
<p>This paragraph appears below the floats.</p>
</body>
</html>

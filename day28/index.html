<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Grid Example</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>

<div class="container my-5">
  <div class="row">

    <!-- Column 1: full width on mobile -->
    <div class="col-12 col-md-4 p-4 mb-3 bg-light text-center">
      <h1 class="display-6">Column One</h1>
      <p>This column spans full width on mobile.</p>
    </div>

    <!-- Column 2 -->
    <div class="col-12 col-md-4 p-4 mb-3 bg-secondary text-white text-center">
      <h2 class="display-6">Column Two</h2>
      <p>Responsive column with padding and margin.</p>
    </div>

    <!-- Column 3 -->
    <div class="col-12 col-md-4 p-4 mb-3 bg-dark text-white text-center">
      <h2 class="display-6">Column Three</h2>
      <p>Text centered using Bootstrap utilities.</p>
    </div>

  </div>
</div>

</body>
</html>

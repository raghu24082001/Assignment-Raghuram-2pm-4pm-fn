<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Grid</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .grid-container {
      display: grid;
      height: 100vh;

      grid-template-rows: 80px 1fr 60px;
      grid-template-columns: 1fr 2fr;

      grid-template-areas:
        "header header"
        "left right"
        "footer footer";
    }

    .header {
      grid-area: header;
      background: #4A90E2;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .left {
      grid-area: left;
      background: #F5A623;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .right {
      grid-area: right;
      background: #7ED321;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .footer {
      grid-area: footer;
      background: #4A4A4A;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
    }
  </style>
</head>

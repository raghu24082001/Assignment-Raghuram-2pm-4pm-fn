<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Grid</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .product-grid {
      display: grid;
      gap: 20px; /* equal spacing */
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      
    }

    .product-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product-card h3 {
      margin: 15px 0 10px;
      font-size: 18px;
    }

    .product-card p {
      color: #555;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .product-card button {
      background: #4A90E2;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .product-card button:hover {
      background: #357ABD;
    }
  </style>
</head>

<body>

  <h1 style="text-align:center; margin-bottom:30px;">Product Grid</h1>

  <div class="product-grid">
    <div class="product-card">
      <img src="" alt="Product">
      <h3>Product 1</h3>
      <p>$19.99</p>
      <button>Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="" alt="Product">
      <h3>Product 2</h3>
      <p>$24.99</p>
      <button>Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="" alt="Product">
      <h3>Product 3</h3>
      <p>$14.99</p>
      <button>Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="" alt="Product">
      <h3>Product 4</h3>
      <p>$29.99</p>
      <button>Add to Cart</button>
    </div>
  </div>

</body>
</html>

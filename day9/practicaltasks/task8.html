<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height:100vh;
            background-color: aquamarine;
            display: flex;
            gap: 10px;
            flex-direction: column;
            align-items: end;
            justify-content: end;
            
        }
        .chatbox{
                display: flex;
                flex-direction: column-reverse;
                align-items: end;
                gap:10px;
                width: 167px;
                
        }
        input{
            padding: 10px;
            width: 100%;
        }
       

    </style>
</head>
<body>
    <div class="container">
    <div class="chatbox">
        <div class="chat">How are you!</div>
        <div class="chat">Hello</div>
        <div class="chat">Hi There</div>
    </div>
    <input type="text" placeholder="Type a Text">
      </div>
</body>
</html>

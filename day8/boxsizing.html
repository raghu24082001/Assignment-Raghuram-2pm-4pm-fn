<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            
        }
        .container1{
            height:400px;
            width: 400px;
            background-color: aquamarine;
            padding: 25px;
            box-sizing: border-box;
             }
        .box1{
           
            height:350px;
            width: 350px;
            background-color:brown;
        }
         .container2{
            height:400px;
            width: 400px;
            background-color: aquamarine;
            padding: 25px;
            box-sizing: content-box;
             }
        .box2{
           
            height:350px;
            width: 350px;
            background-color:brown;
        }
         
    </style>

</head>
<body>
    <div class="container1">
        <div class="box1"></div>
       
    </div>
    <br>
     <div class="container2">
        <div class="box2"></div>
       
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: aqua;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
             }
        .box1{
            min-height:300px;
            min-width:300px;
            background-color: bisque;
            margin: 10px;
            padding: 10px;
            border: 2px solid black;
            box-sizing: border-box;
            
        }
         .box2{
            min-height:300px;
            min-width:300px;
            background-color: red;
            margin: 10px;
            border: 2px dashed black;
            box-sizing: border-box;

        }
         .box3{
            min-height:300px;
            min-width:300px;
            background-color: blue;
            margin: 10px;
            border: 2px double black;
            box-sizing: border-box;

        }
        .boxx{
            height:280px;
            width: 280px;
            background-color: olivedrab;
            margin: 10px;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="box1"><div class="boxx"></div></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>
</html>

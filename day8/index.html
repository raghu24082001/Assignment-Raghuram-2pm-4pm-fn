<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            width: 100vw;
            border: 1px solid black;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
        }
        .box{
           min-width: 300px;
            height: 300px;
            background-color: bisque;
            margin: 20px;
            box-sizing: border-box;
            border: 1px solid black;
            align-content: center;
            }
            .box:nth-child(1){
                flex: 1;
            }

    </style>
</head>
<body>
    <div class="con">
  <div class="box"></div>
   <div class="box"></div>
   <div class="box"></div>
   <div class="box"></div>
   </div>
        
</body>
</html>

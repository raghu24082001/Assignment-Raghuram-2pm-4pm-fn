<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
       
        ul {
            background-color: blue;
            padding: 10px;
            margin: 0;
        }

        li {
            margin: 10px 20px;
            display: inline-block;
            list-style: none;
            color: white;
        }

       
        @media (max-width: 500px) {

            
            .navbar {
                background-color: blue;
                width: 200px;
                height: 100vh;
            }

            ul {
                padding: 20px;
            }

            li {
                display: block;   
                margin: 15px 0;   
        }
    </style>
</head>
<body>
    <div class="navbar">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Blog</li>
            <li>Contact</li>
        </ul>
    </div>
</body>
</html>

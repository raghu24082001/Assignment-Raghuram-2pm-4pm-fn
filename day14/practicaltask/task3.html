<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr 1fr;
        }
        .con{
            background-color: blue;
            height: 300px;
        }
        @media (max-width:700px) {
            .container{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
          <div class="con"></div>
          <div class="con"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
        }
        .container{
            height:100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        form{
            border-radius: 10px;
            padding: 20px 40px;
            border:1px solid black;
            background:linear-gradient(to right,skyblue,white);
        }
        #form input{
            width: 100%;
            text-align: center;
            margin: 20px 0px;
        }
        #form select{
            text-align: center;
            display: block;
            align-items: center;
        }
        #form button{
          display: block;
          
        }
        .container p{
            margin: 10px;
            font-size: 20px;
        }
    </style>
    
</head>
<body>
    <div class="container">
    <form action=""  id="form">
        <input type="text" id="input1">
        <select name="" id="select">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
        <input type="text" id="input2">
    <button type="submit">Submit</button>
    </form>
    <p id="answer"></p>
    </div>
   <script src="./index.js"></script>
</body>
</html>
